[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratascan"
version = "0.2.4"
description = "Adaptive density-stratified clustering and reusable density/graph clustering reference implementations"
keywords = ["clustering", "density-based-clustering", "variable-density", "knn", "stratascan", "dbscan", "hdbscan", "optics", "snn-dbscan", "vdbscan", "amd-dbscan", "knn-dbscan", "leiden", "x-shift", "dpc-knn"]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "StrataSCAN contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=2.0",
  "numba>=0.61",
  "scipy>=1.13",
  "scikit-learn>=1.5",
]

[project.urls]
Repository = "https://github.com/VEK239/StrataSCAN"
Documentation = "https://github.com/VEK239/StrataSCAN/blob/publication/oedm2026-article/README.md"
Issues = "https://github.com/VEK239/StrataSCAN/issues"
Citation = "https://github.com/VEK239/StrataSCAN/blob/publication/oedm2026-article/CITATION.cff"

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2", "build>=1"]
perf = ["faiss-cpu>=1.8"]
baselines = ["faiss-cpu>=1.8", "igraph>=0.11", "leidenalg>=0.10"]
benchmark = ["pandas>=2", "psutil>=5.9", "igraph>=0.11", "leidenalg>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
